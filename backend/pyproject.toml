[project]
name = "deskpilot"
version = "0.1.0"
description = "Production-style AI support agent for the fictional Acme Gear shop."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.2",
    "langchain-core>=1.6.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs real external services such as Ollama or Postgres",
]
# Integration tests are skipped by default. Run them with: uv run pytest -m integration
addopts = "-ra --strict-markers --import-mode=importlib -m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "ASYNC",    # async pitfalls, e.g. blocking calls in coroutines
    "S",        # bandit security checks
    "SIM",      # simplifications
    "PT",       # pytest style
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]
