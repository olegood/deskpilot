[project]
name = "deskpilot"
version = "0.1.0"
description = "Production-style AI support agent for the fictional Acme Gear shop."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.2",
    "langchain-core>=1.6.3",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
deskpilot = "deskpilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs real external services such as Ollama or Postgres",
    "slow: takes seconds rather than milliseconds; deselect with -m 'not slow'",
]
# Integration tests are skipped by default. Run them with: uv run pytest -m integration
addopts = "-ra --strict-markers --import-mode=importlib -m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "ASYNC",    # async pitfalls, e.g. blocking calls in coroutines
    "S",        # bandit security checks
    "SIM",      # simplifications
    "PT",       # pytest style
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.uv.sources]
shiptrack = { path = "../vendors/shiptrack", editable = true }

[tool.ruff.lint.isort]
# Without this, `tests` is treated as a third-party package and sorted above deskpilot.
known-first-party = ["deskpilot", "tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
    "shiptrack",
]
