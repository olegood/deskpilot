# Local infrastructure for Deskpilot development.
# Ollama is deliberately not here: it runs natively for GPU access (see docs/decisions.md, D-003).
# Usage (from the repo root): docker compose up -d

name: deskpilot

services:
  postgres:
    # pgvector's image is PostgreSQL plus the vector extension, which the policy
    # search index needs. Migration 0003 runs CREATE EXTENSION.
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: deskpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the repo-root .env file}
      POSTGRES_DB: deskpilot
    ports:
      # Loopback only: the database is not reachable from your network.
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<version>/docker.
      - postgres-data:/var/lib/postgresql
      # Scripts here run once, on the first start with an empty volume.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskpilot -d deskpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  shiptrack:
    # A fictional shipping carrier. A separate service with its own secret, so the
    # integration is over a network rather than through an import.
    build: ./vendors/shiptrack
    restart: unless-stopped
    environment:
      SHIPTRACK_HOST: 0.0.0.0
      SHIPTRACK_SECRET: ${SHIPTRACK_SECRET:?set SHIPTRACK_SECRET in the repo-root .env file}
      # Where to call back when a parcel moves, and a separate secret for it.
      SHIPTRACK_WEBHOOK_URL: ${SHIPTRACK_WEBHOOK_URL:-}
      SHIPTRACK_WEBHOOK_SECRET: ${SHIPTRACK_WEBHOOK_SECRET:-}
      # Chaos is off by default. Turn it up to see what the client does about it.
      SHIPTRACK_CHAOS__LATENCY_MS: ${SHIPTRACK_LATENCY_MS:-0}
      SHIPTRACK_CHAOS__ERROR_RATE: ${SHIPTRACK_ERROR_RATE:-0}
      SHIPTRACK_CHAOS__HANG_RATE: ${SHIPTRACK_HANG_RATE:-0}
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/health')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  paywisp-auth:
    # A fictional payment processor's OAuth authorization server. Its MCP server
    # (below) is a second container built from the same image, and learns the
    # signing keys the way any resource server would: from the JWKS, over HTTP.
    build: ./vendors/paywisp
    command: ["uv", "run", "python", "-m", "paywisp.auth_server"]
    restart: unless-stopped
    environment:
      PAYWISP_AUTH_HOST: 0.0.0.0
      # What clients are told the issuer is, and what every token's `iss` says.
      # Deskpilot runs on the host, so this is the host-side address.
      PAYWISP_AUTH_ISSUER: http://127.0.0.1:8200
      PAYWISP_AUTH_AGENT_CLIENT_SECRET: ${PAYWISP_AGENT_CLIENT_SECRET:?set PAYWISP_AGENT_CLIENT_SECRET in the repo-root .env file}
      PAYWISP_AUTH_SIGNING_KEY: ${PAYWISP_SIGNING_KEY:-}
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health')\""]
      interval: 10s
      timeout: 3s
      retries: 5

  paywisp-mcp:
    # Paywisp's MCP server: the payments API, as tools. Same image, second process.
    # No depends_on: it fetches keys on the first request, not at start, and until
    # it can it refuses every token rather than accepting any (fail closed).
    build: ./vendors/paywisp
    command: ["uv", "run", "python", "-m", "paywisp.mcp_server"]
    restart: unless-stopped
    environment:
      PAYWISP_MCP_HOST: 0.0.0.0
      # The name tokens carry is the host-side one, the address this container
      # can reach is the service name. The two differ only inside Compose.
      PAYWISP_MCP_ISSUER: http://127.0.0.1:8200
      PAYWISP_MCP_JWKS_URL: http://paywisp-auth:8200/.well-known/jwks.json
      PAYWISP_MCP_RESOURCE: http://127.0.0.1:8210/mcp
    ports:
      - "127.0.0.1:8210:8210"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8210/health')\""]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
